<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Test Renovación de Tokens</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left-color: #f44336;
        }
        .warning {
            border-left-color: #ff9800;
        }
        .info {
            border-left-color: #2196F3;
        }
        button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        button.danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        button.warning {
            background: linear-gradient(45deg, #ff9800, #f57c00);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            max-height: 300px;
            overflow-y: auto;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.3); }
        .error-status { background: rgba(244, 67, 54, 0.3); }
        .warning-status { background: rgba(255, 152, 0, 0.3); }
        input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Test Renovación de Tokens</h1>
        
        <div class="section info">
            <h3>📋 Estado Actual del Sistema</h3>
            <div id="systemStatus">
                <p>Verificando estado del sistema...</p>
            </div>
        </div>

        <div class="section">
            <h3>🔐 Información de Tokens</h3>
            <div id="tokenInfo">
                <p>Cargando información de tokens...</p>
            </div>
        </div>

        <div class="section">
            <h3>🧪 Pruebas de Renovación</h3>
            <button onclick="testRefreshEndpoint()">🔄 Probar Endpoint Refresh</button>
            <button onclick="testWithCurrentToken()">🎯 Probar con Token Actual</button>
            <button onclick="testWithExpiredToken()" class="warning">⏰ Simular Token Expirado</button>
            <button onclick="testWithInvalidToken()" class="danger">❌ Probar Token Inválido</button>
        </div>

        <div class="section">
            <h3>🔧 Herramientas de Debug</h3>
            <button onclick="generateNewToken()">🆕 Generar Token Nuevo</button>
            <button onclick="clearAllTokens()" class="danger">🧹 Limpiar Tokens</button>
            <button onclick="loginWithCredentials()">🔐 Login Manual</button>
        </div>

        <div class="section">
            <h3>📝 Credenciales de Prueba</h3>
            <input type="text" id="testCC" placeholder="CC (1038647805)" value="1038647805">
            <input type="password" id="testPassword" placeholder="Contraseña">
        </div>

        <div class="section">
            <h3>📊 Log de Actividades</h3>
            <div id="log">
                <p>Esperando pruebas...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/v1';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const statusClass = type === 'error' ? 'error-status' : 
                               type === 'warning' ? 'warning-status' : 
                               type === 'success' ? 'success' : '';
            
            logDiv.innerHTML += `<div class="status ${statusClass}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function getStoredToken() {
            return localStorage.getItem('auth_token') || 
                   sessionStorage.getItem('auth_token') || 
                   getCookie('auth_token') || 
                   getCookie('jwt') || 
                   getCookie('token');
        }

        async function checkSystemStatus() {
            try {
                log('🔍 Verificando estado del backend...', 'info');
                const response = await fetch(`${API_BASE.replace('/api/v1', '')}/health`);
                
                if (response.ok) {
                    log('✅ Backend disponible', 'success');
                    document.getElementById('systemStatus').innerHTML = `
                        <div class="success">✅ Backend: Disponible</div>
                        <div>🌐 URL: ${API_BASE}</div>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                log(`❌ Backend no disponible: ${error.message}`, 'error');
                document.getElementById('systemStatus').innerHTML = `
                    <div class="error-status">❌ Backend: No disponible</div>
                    <div>Error: ${error.message}</div>
                `;
            }
        }

        function checkTokenInfo() {
            const token = getStoredToken();
            
            if (!token) {
                document.getElementById('tokenInfo').innerHTML = `
                    <div class="warning-status">⚠️ No se encontró token almacenado</div>
                `;
                log('⚠️ No hay token disponible', 'warning');
                return;
            }

            try {
                // Decodificar token JWT (solo la parte del payload)
                const payload = JSON.parse(atob(token.split('.')[1]));
                const now = Math.floor(Date.now() / 1000);
                const isExpired = payload.exp < now;
                
                document.getElementById('tokenInfo').innerHTML = `
                    <div class="${isExpired ? 'error-status' : 'success'}">
                        ${isExpired ? '❌' : '✅'} Token ${isExpired ? 'EXPIRADO' : 'VÁLIDO'}
                    </div>
                    <div><strong>ID Usuario:</strong> ${payload.id}</div>
                    <div><strong>Rol:</strong> ${payload.role || 'No especificado'}</div>
                    <div><strong>Emitido:</strong> ${new Date(payload.iat * 1000).toLocaleString()}</div>
                    <div><strong>Expira:</strong> ${new Date(payload.exp * 1000).toLocaleString()}</div>
                    <div><strong>Tiempo restante:</strong> ${isExpired ? 'EXPIRADO' : Math.floor((payload.exp - now) / 60)} minutos</div>
                `;
                
                log(`🔍 Token analizado: ${isExpired ? 'EXPIRADO' : 'VÁLIDO'}`, isExpired ? 'error' : 'success');
            } catch (error) {
                document.getElementById('tokenInfo').innerHTML = `
                    <div class="error-status">❌ Token inválido o corrupto</div>
                    <div>Error: ${error.message}</div>
                `;
                log(`❌ Error al analizar token: ${error.message}`, 'error');
            }
        }

        async function testRefreshEndpoint() {
            log('🔄 Probando endpoint de renovación...', 'info');
            const token = getStoredToken();
            
            if (!token) {
                log('❌ No hay token para renovar', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/refresh-token`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                const data = await response.json();
                
                if (response.ok) {
                    log('✅ Token renovado exitosamente', 'success');
                    log(`📋 Respuesta: ${JSON.stringify(data, null, 2)}`, 'info');
                    
                    // Actualizar token si viene en la respuesta
                    if (data.token) {
                        localStorage.setItem('auth_token', data.token);
                        log('💾 Token actualizado en localStorage', 'success');
                    }
                    
                    checkTokenInfo();
                } else {
                    log(`❌ Error en renovación: ${data.message}`, 'error');
                    log(`📋 Respuesta completa: ${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                log(`❌ Error de red: ${error.message}`, 'error');
            }
        }

        async function testWithCurrentToken() {
            log('🎯 Probando con token actual...', 'info');
            await testRefreshEndpoint();
        }

        async function testWithExpiredToken() {
            log('⏰ Simulando token expirado...', 'warning');
            
            // Crear un token expirado (simulado)
            const expiredToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY4Y2M1YTYxYzJjNzdhN2IyMTliZGVjMCIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTY1OTE3MjA4MywiZXhwIjoxNjU5MTcyMDg0fQ.invalid';
            
            try {
                const response = await fetch(`${API_BASE}/auth/refresh-token`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${expiredToken}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                const data = await response.json();
                log(`📋 Respuesta con token expirado: ${JSON.stringify(data, null, 2)}`, 'warning');
            } catch (error) {
                log(`❌ Error con token expirado: ${error.message}`, 'error');
            }
        }

        async function testWithInvalidToken() {
            log('❌ Probando con token inválido...', 'warning');
            
            try {
                const response = await fetch(`${API_BASE}/auth/refresh-token`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer invalid.token.here',
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                const data = await response.json();
                log(`📋 Respuesta con token inválido: ${JSON.stringify(data, null, 2)}`, 'warning');
            } catch (error) {
                log(`❌ Error con token inválido: ${error.message}`, 'error');
            }
        }

        async function generateNewToken() {
            log('🆕 Generando token nuevo via login...', 'info');
            await loginWithCredentials();
        }

        function clearAllTokens() {
            log('🧹 Limpiando todos los tokens...', 'warning');
            
            // Limpiar localStorage
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_data');
            
            // Limpiar sessionStorage
            sessionStorage.removeItem('auth_token');
            sessionStorage.removeItem('user_data');
            
            // Limpiar cookies
            document.cookie = 'auth_token=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
            document.cookie = 'jwt=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
            document.cookie = 'token=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
            
            log('✅ Tokens limpiados', 'success');
            checkTokenInfo();
        }

        async function loginWithCredentials() {
            const cc = document.getElementById('testCC').value;
            const password = document.getElementById('testPassword').value;
            
            if (!cc || !password) {
                log('❌ Por favor ingresa CC y contraseña', 'error');
                return;
            }

            log('🔐 Intentando login...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/auth/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ cc, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    log('✅ Login exitoso', 'success');
                    
                    if (data.token) {
                        localStorage.setItem('auth_token', data.token);
                        log('💾 Token guardado en localStorage', 'success');
                    }
                    
                    checkTokenInfo();
                } else {
                    log(`❌ Error en login: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Error de red en login: ${error.message}`, 'error');
            }
        }

        // Inicializar al cargar la página
        window.onload = function() {
            log('🚀 Herramienta de test de renovación iniciada', 'success');
            checkSystemStatus();
            checkTokenInfo();
        };
    </script>
</body>
</html>
