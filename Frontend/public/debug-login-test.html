<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Test de Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test de Login - OccupyManager</h1>
        
        <div class="form-group">
            <label for="cc">Cédula:</label>
            <input type="text" id="cc" placeholder="Ingresa tu cédula" value="12345678">
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" value="password123">
        </div>
        
        <button onclick="testLogin()">🚀 Probar Login</button>
        <button onclick="checkAuthStatus()">🔍 Verificar Estado de Auth</button>
        <button onclick="testReservas()">📋 Probar Reservas (requiere login)</button>
        
        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'https://ocuppymanagger-api.netlify.app/api/v1';
        
        function showResult(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result ${type}">${message}</div>`;
        }
        
        async function testLogin() {
            const cc = document.getElementById('cc').value;
            const password = document.getElementById('password').value;
            
            if (!cc || !password) {
                showResult('❌ Por favor ingresa cédula y contraseña', 'error');
                return;
            }
            
            try {
                showResult('🔄 Intentando login...', 'info');
                
                const response = await fetch(`${API_BASE}/auth/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ cc, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Guardar token en cookie (simulando el comportamiento del frontend)
                    document.cookie = `auth_token=${data.token}; path=/; max-age=604800`;
                    
                    showResult(`✅ Login exitoso!<br>
                        <strong>Usuario:</strong> ${data.user.nombre}<br>
                        <strong>Rol:</strong> ${data.user.rol}<br>
                        <strong>Token:</strong> ${data.token.substring(0, 50)}...`, 'success');
                } else {
                    showResult(`❌ Error en login: ${data.error || 'Credenciales inválidas'}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error de conexión: ${error.message}`, 'error');
            }
        }
        
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
        
        function checkAuthStatus() {
            const token = getCookie('auth_token');
            
            if (token) {
                try {
                    // Decodificar JWT (básico)
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const exp = new Date(payload.exp * 1000);
                    const now = new Date();
                    
                    if (exp > now) {
                        showResult(`✅ Usuario autenticado<br>
                            <strong>ID:</strong> ${payload.userId}<br>
                            <strong>Expira:</strong> ${exp.toLocaleString()}<br>
                            <strong>Token válido:</strong> Sí`, 'success');
                    } else {
                        showResult('⚠️ Token expirado', 'error');
                    }
                } catch (error) {
                    showResult('❌ Token inválido', 'error');
                }
            } else {
                showResult('❌ No hay token de autenticación. Necesitas hacer login primero.', 'error');
            }
        }
        
        async function testReservas() {
            const token = getCookie('auth_token');
            
            if (!token) {
                showResult('❌ No hay token. Haz login primero.', 'error');
                return;
            }
            
            try {
                showResult('🔄 Probando acceso a reservas...', 'info');
                
                const response = await fetch(`${API_BASE}/reservas`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showResult(`✅ Acceso a reservas exitoso!<br>
                        <strong>Reservas encontradas:</strong> ${data.length || 0}`, 'success');
                } else {
                    const errorData = await response.json();
                    showResult(`❌ Error ${response.status}: ${errorData.error || 'No autorizado'}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error de conexión: ${error.message}`, 'error');
            }
        }
        
        // Verificar estado al cargar la página
        window.onload = function() {
            checkAuthStatus();
        };
    </script>
</body>
</html>
